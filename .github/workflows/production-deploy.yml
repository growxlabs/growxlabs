name: GrowXLabs Production CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    name: Production Verification & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go Environment
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Generate Design System Artifacts (Panda CSS)
        run: npm run prepare

      - name: Restore Turbopack & TypeScript Cache
        uses: actions/cache@v3
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Run TypeScript Type Check (tsc --noEmit)
        run: npm run type-check

      - name: Run Go Unit Tests (Command Center & People Ops)
        run: bash scripts/run-all-go-tests.sh

      - name: Run Production Hardening Verification Tests
        run: npm run test:phase8

      - name: Run Production Readiness Verification Script
        run: npx tsx scripts/verify-production-readiness.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Next.js Production Build Test
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy-to-vercel:
    name: Deploy to Vercel Production
    needs: audit-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Trigger Vercel Production Deployment
        run: echo "Triggering automated Vercel Production Deployment Hook..."
